services:
  - type: web
    name: docmind-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://your-vercel-domain.vercel.app" # Replace with your Vercel URL after deployment
      - key: DATABASE_URL
        sync: false # Set your database URL (PostgreSQL or MySQL) in Render dashboard
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: "/etc/ssl/certs/ca-certificates.crt"


